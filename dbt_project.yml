name: 'FinLink_Payments'
version: '1.0.0'
config-version: 2

profile: 'FinLink_Payments'

# Chemins des dossiers
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuration des modèles
models:
  FinLink_Payments:
    staging:
      +materialized: view       # Les staging = vues légères
      +schema: staging
    marts:
      +materialized: table      # Les marts = tables persistantes pour Power BI
      +schema: marts